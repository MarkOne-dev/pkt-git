!
!
username Router_La_Libertad password 0 ciscochap
username Router_Libertad password 0 ciscochap
username Router_Puno password 0 ciscochap
!
!
license udi pid CISCO2911/K9 sn FTX1524YU46-
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface GigabitEthernet0/0
 ip address 172.19.43.1 255.255.255.252
 ip nat inside
 duplex auto
 speed auto
!
interface GigabitEthernet0/1
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Serial0/1/0
 ip address 17.11.35.2 255.255.255.252
 encapsulation ppp
 ip nat outside
!
interface Serial0/1/1
 ip address 17.11.35.6 255.255.255.252
 encapsulation ppp
 ip nat outside
 clock rate 64000
!
interface Serial0/2/0
 ip address 172.19.47.1 255.255.255.252
!
interface Serial0/2/1
 description Enlace_a_La_Libertad
 ip address 172.19.36.5 255.255.255.252
 encapsulation ppp
 ppp authentication chap
 clock rate 64000
!
interface Serial0/3/0
 description Enlace_a_Puno
 ip address 172.19.36.9 255.255.255.252
 encapsulation ppp
 ppp authentication chap
 clock rate 64000
!
interface Serial0/3/1
 no ip address
 clock rate 2000000
!
interface Vlan1
 no ip address
 shutdown
!
router rip
 version 2
 redistribute static 
 network 172.19.0.0
 no auto-summary
!
ip nat inside source list 1 interface Serial0/1/1 overload
ip classless
ip route 0.0.0.0 0.0.0.0 17.11.35.5 
ip route 172.19.40.0 255.255.252.0 172.19.43.2 
!
ip flow-export version 9
!
!
access-list 1 permit 172.19.0.0 0.0.255.255
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
